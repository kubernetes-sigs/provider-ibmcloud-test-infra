- name: Generate download URL based on S3 server.
  set_fact:
    src_template: >-
      {% if s3_server == 'dl.k8s.io' -%}
        https://{{ s3_server }}/{{ directory }}/{{ build_version }}
      {%- else -%}
        https://{{ s3_server }}/{{ bucket }}/{{ directory }}/{{ build_version }}
      {%- endif %}

- name: Generate the direct download URL on s390x
  set_fact:
    s390x_src_template: >-
      {% if s3_server == 'dl.k8s.io' -%}
        https://storage.googleapis.com/k8s-release-dev/{{ directory }}/{{ build_version }}
      {%- else -%}
        {{ src_template }}
      {%- endif %}
  when: ansible_facts['architecture'] == 's390x'

- name: Download the k8s bits on s390x
  get_url:
    url: "{{ s390x_src_template }}/{{ item }}"
    dest: "/var/tmp/{{ item }}"
    mode: '0644'
    timeout: 120
    checksum: "{{ 'sha256:' ~ s390x_src_template ~ '/' ~ item ~ '.sha256' if s3_server == 'dl.k8s.io' else omit }}"
  with_items: "{{ k8s_tar_bundles }}"
  register: download_k8s_result
  async: 600
  poll: 10
  retries: 2
  delay: 15
  until: download_k8s_result is succeeded
  when: ansible_facts['architecture'] == 's390x'

- name: Extract the k8s bits on s390x
  command:
    argv:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - "900"
      - tar
      - --extract
      - --gzip
      - --file
      - "/var/tmp/{{ item }}"
      - --directory
      - /usr/bin
      - --strip-components=3
  with_items: "{{ k8s_tar_bundles }}"
  register: extract_k8s_result
  retries: 2
  delay: 15
  until: extract_k8s_result is succeeded
  when: ansible_facts['architecture'] == 's390x'

- name: Remove downloaded k8s archives on s390x
  file:
    path: "/var/tmp/{{ item }}"
    state: absent
  with_items: "{{ k8s_tar_bundles }}"
  when: ansible_facts['architecture'] == 's390x'

- name: Extract the k8s bits
  unarchive:
    src: "{{ src_template }}/{{ item }}"
    dest: "/usr/bin/"
    remote_src: yes
    extra_opts:
      - --strip-components=3
  with_items: "{{ k8s_tar_bundles }}"
  retries: 3
  delay: 5
  when: ansible_facts['architecture'] != 's390x'

- name: Import control plane component container images
  shell: |
    export ARCH={{ ansible_facts['architecture'] }}
    ctr -n k8s.io images import "/usr/bin/{{ item }}.tar"
    ctr -n k8s.io images ls -q | grep -e {{ item }} | xargs -L 1 -I '{}' /bin/bash -c 'ctr -n k8s.io images tag "{}" "$(echo "{}" | sed s/-'$ARCH':/:/)"'
  with_items:
    - kube-apiserver
    - kube-controller-manager
    - kubectl
    - kube-scheduler
  when: node_type == "master"

- name: Import common container images required for setting up cluster
  shell: |
    export ARCH={{ ansible_facts['architecture'] }}
    ctr -n k8s.io images import "/usr/bin/{{ item }}.tar"
    ctr -n k8s.io images ls -q | grep -e {{ item }} | xargs -L 1 -I '{}' /bin/bash -c 'ctr -n k8s.io images tag "{}" "$(echo "{}" | sed s/-'$ARCH':/:/)"'
  with_items:
    - kube-proxy
